<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IIT Smart Quiz Ultimate</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#141E30,#243B55);
    color:white;
    text-align:center;
}

/* HEADER */
.header{
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

/* STATS */
.stats{
    font-size:18px;
    margin-bottom:15px;
}

/* TIMER */
.timerSection{
    margin:20px auto;
    width:160px;
    height:160px;
    position:relative;
}

svg{
    transform:rotate(-90deg);
}

circle{
    fill:none;
    stroke-width:10;
}

.bgCircle{ stroke:#333; }

.progressCircle{
    stroke:#00ffcc;
    stroke-linecap:round;
    transition:1s linear;
}

.timerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    font-weight:bold;
}

/* CARD */
.card{
    width:60%;
    margin:20px auto 40px;
    padding:25px;
    background:rgba(255,255,255,0.08);
    border-radius:16px;
    box-shadow:0 0 20px rgba(0,255,255,0.3);
}

/* BUTTONS */
button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.optionBtn{ background:#00c6ff; }

.optionBtn:hover{ transform:scale(1.05); }

.correct{
    background:green !important;
    animation:correctFlash 0.5s ease-in-out;
}

@keyframes correctFlash{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

.wrong{ background:red !important; }

/* STREAK */
.combo{
    position:fixed;
    top:25%;
    left:50%;
    transform:translateX(-50%);
    font-size:32px;
    font-weight:bold;
    color:#ffcc00;
    animation:comboAnim 1s ease-in-out;
}

@keyframes comboAnim{
    0%{opacity:0; transform:translate(-50%,0) scale(0.5);}
    50%{opacity:1; transform:translate(-50%,-20px) scale(1.2);}
    100%{opacity:0; transform:translate(-50%,-40px) scale(1);}
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="header">🚀 IIT Smart Quiz Ultimate</div>

<div class="stats">
Correct: <span id="correct">0</span> |
Wrong: <span id="wrong">0</span> |
Accuracy: <span id="accuracy">0%</span>
</div>

<div class="timerSection">
<svg width="160" height="160">
<circle class="bgCircle" cx="80" cy="80" r="70"></circle>
<circle class="progressCircle" cx="80" cy="80" r="70"
stroke-dasharray="440"
stroke-dashoffset="0"
id="circleProgress"></circle>
</svg>
<div class="timerText" id="timeText">20</div>
</div>

<div class="card">
<h2 id="question">Loading...</h2>
<div id="options"></div>
<input type="text" id="fillAnswer" style="display:none;">
<br>
<button onclick="submitFill()">Submit</button>
</div>

<canvas id="confetti"></canvas>

<!-- AUDIO -->
<audio id="bgMusic" preload="auto" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_9c3e5a5f6a.mp3" type="audio/mp3">
</audio>

<audio id="correctSound" preload="auto">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b4b6d4d6f.mp3" type="audio/mp3">
</audio>

<audio id="wrongSound" preload="auto">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_62b59b21f1.mp3" type="audio/mp3">
</audio>

<script>

let questions=[];
let currentIndex=0;
let correctCount=0;
let wrongCount=0;
let streak=0;
let timeLeft=20;
let timer;
const FULL=440;

/* AUDIO ENGINE */
const bgMusic=document.getElementById("bgMusic");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

function unlockAudio(){
    bgMusic.volume=0.3;
    bgMusic.play().catch(()=>{});
    correctSound.play().then(()=>correctSound.pause()).catch(()=>{});
    wrongSound.play().then(()=>wrongSound.pause()).catch(()=>{});
}
document.addEventListener("click",unlockAudio,{once:true});

function playSound(sound){
    sound.currentTime=0;
    sound.play().catch(()=>{});
}

/* LOAD QUESTIONS */
fetch("patterns_ch1_full_200.json")
.then(res=>res.json())
.then(data=>{
    questions=[
        ...data.easy,
        ...data.moderate,
        ...data.hard,
        ...data.supernatural
    ];
    loadQuestion();
});

function loadQuestion(){

    if(currentIndex>=questions.length){
        showConfetti();
        alert("🎉 YOU COMPLETED ALL QUESTIONS!");
        return;
    }

    clearInterval(timer);
    timeLeft=20;
    updateCircle();
    timer=setInterval(updateTimer,1000);

    let q=questions[currentIndex];
    document.getElementById("question").innerText=q.q;

    let optDiv=document.getElementById("options");
    let fill=document.getElementById("fillAnswer");

    optDiv.innerHTML="";
    fill.style.display="none";
    fill.value="";

    if(q.type==="mcq"){
        q.options.forEach(opt=>{
            let btn=document.createElement("button");
            btn.innerText=opt;
            btn.classList.add("optionBtn");
            btn.onclick=()=>checkAnswer(opt,btn);
            optDiv.appendChild(btn);
        });
    }

    if(q.type==="fill"){
        fill.style.display="inline";
    }
}

function updateTimer(){
    timeLeft--;
    updateCircle();
    if(timeLeft<=0){
        clearInterval(timer);
        checkAnswer("timeout");
    }
}

function updateCircle(){
    document.getElementById("timeText").innerText=timeLeft;
    let offset = FULL - (timeLeft/20)*FULL;
    document.getElementById("circleProgress").style.strokeDashoffset=offset;
}

function submitFill(){
    let val=document.getElementById("fillAnswer").value;
    checkAnswer(val);
}

function checkAnswer(ans,btn=null){

    clearInterval(timer);
    let correctAns=questions[currentIndex].answer;

    if(ans.toString().toLowerCase()===correctAns.toString().toLowerCase()){

        correctCount++;
        streak++;
        playSound(correctSound);

        if(btn) btn.classList.add("correct");

        if(streak>=3){
            showCombo();
        }

    }else{
        wrongCount++;
        streak=0;
        playSound(wrongSound);
        if(btn) btn.classList.add("wrong");
    }

    updateStats();
    currentIndex++;
    setTimeout(loadQuestion,1200);
}

function updateStats(){
    document.getElementById("correct").innerText=correctCount;
    document.getElementById("wrong").innerText=wrongCount;
    let total=correctCount+wrongCount;
    let acc= total? ((correctCount/total)*100).toFixed(1):0;
    document.getElementById("accuracy").innerText=acc+"%";
}

function showCombo(){
    let div=document.createElement("div");
    div.className="combo";
    div.innerText="🔥 "+streak+" COMBO!";
    document.body.appendChild(div);
    setTimeout(()=>div.remove(),1000);
}

/* CONFETTI */
function showConfetti(){
    const canvas=document.getElementById("confetti");
    const ctx=canvas.getContext("2d");
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    let pieces=[];
    for(let i=0;i<200;i++){
        pieces.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height,
            size:Math.random()*8,
            speed:Math.random()*3+2
        });
    }

    function update(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p=>{
            ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
            ctx.fillRect(p.x,p.y,p.size,p.size);
            p.y+=p.speed;
        });
        requestAnimationFrame(update);
    }
    update();
}

</script>
</body>
</html>
